name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes screenshots to the `screenshots` branch
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The real google-services.json is not committed. CI builds against a
      # placeholder so the google-services plugin can run; Firebase calls are
      # never exercised by unit tests.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp .github/ci/google-services.dummy.json app/google-services.json
          fi

      # Plugin and dependency downloads occasionally fail on a cold cache (Maven
      # Central rate limits). Resolve them up front with retries so a network blip
      # is retried here and never by re-running tests.
      - name: Resolve dependencies
        run: |
          for attempt in 1 2 3; do
            ./gradlew :domain:dependencies --configuration testRuntimeClasspath -q > /dev/null &&
              ./gradlew :app:dependencies --configuration debugRuntimeClasspath -q > /dev/null &&
              ./gradlew :app:dependencies --configuration debugUnitTestRuntimeClasspath -q > /dev/null && exit 0
            echo "Dependency resolution failed (attempt $attempt), retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Unit tests (domain)
        run: ./gradlew :domain:test --stacktrace

      - name: Build debug APK and run app unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      # Release is minified and resource-shrunk with R8. Building it on every PR catches
      # missing keep rules (Room, Gson backup models, Firebase) before a Play upload.
      # Unsigned: signing happens outside CI.
      - name: Build release APK (R8)
        run: ./gradlew :app:assembleRelease --stacktrace

      # Screenshots and the Room schema go to the `screenshots` branch (overwritten each run)
      # so they can be reviewed without downloading artifacts. Same-repo PRs and main only.
      - name: Publish screenshots
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          [ -d app/build/outputs/roborazzi ] || exit 0
          out=$(mktemp -d)
          cp app/build/outputs/roborazzi/*.png "$out"/
          cp -r app/schemas "$out"/ 2>/dev/null || true
          cd "$out"
          git init -q -b screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/schemas/
            app/build/outputs/roborazzi/
          retention-days: 7
