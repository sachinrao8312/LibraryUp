name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The real google-services.json is not committed. CI builds against a
      # placeholder so the google-services plugin can run; Firebase calls are
      # never exercised by unit tests.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp .github/ci/google-services.dummy.json app/google-services.json
          fi

      - name: Unit tests (domain)
        run: ./gradlew :domain:test --stacktrace

      - name: Build debug APK and run app unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/tests/
            app/build/outputs/apk/debug/*.apk
          retention-days: 7
