name: v0 audit screenshots

# Renders the theme specimen with the v0 branch's theme (after) and with main's theme
# (before), and publishes both to the `screenshots-v0-audit` branch for review.
on:
  push:
    branches: [claude/v0-audit-screenshots]
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Placeholder google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"rentup-ci-placeholder","storage_bucket":"rentup-ci-placeholder.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"ai.sach.rentup"}},
           "oauth_client":[],"api_key":[{"current_key":"AIzaSyCI_PLACEHOLDER_NOT_A_REAL_KEY_000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],
           "configuration_version":"1"}
          JSON

      - name: After (v0 theme)
        run: ./gradlew :app:testDebugUnitTest --tests '*ThemeSpecimenTest*' -PshotsDir=$PWD/shots/after --stacktrace

      - name: Before (main theme)
        run: |
          git checkout origin/main -- app/src/main/java/ai/sach/rentup/ui/theme \
            app/src/main/java/ai/sach/rentup/ui/screens/homescreen/HomeScreen.kt \
            app/src/main/java/ai/sach/rentup/ui/screens/properties/PropertiesScreen.kt
          ./gradlew :app:testDebugUnitTest --tests '*ThemeSpecimenTest*' -PshotsDir=$PWD/shots/before --stacktrace

      - name: Publish
        if: always()
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b screenshots-v0-audit
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "v0 audit screenshots for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-v0-audit
